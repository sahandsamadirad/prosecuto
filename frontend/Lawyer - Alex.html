<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>Prosecuto · Lawyer Mode — Alex</title>
<style>
/* ============================================================
   PROSECUTO — shared design system
   Editorial legal-tech: warm paper, ink black, refined serif.
   ============================================================ */


:root {
  /* paper + ink */
  --bg:        #F4F3EF;   /* Harvey clean warm-white (de-saturated) */
  --bg-tint:   #ECEAE3;   /* slightly deeper panel */
  --surface:   #FBFBF8;   /* card / raised */
  --surface-2: #F7F6F1;
  --ink:       #1F1D1A;   /* Harvey brand ink (theme-color) */
  --muted:     #6B675F;   /* secondary text */
  --muted-2:   #95918A;   /* tertiary (neutralised) */
  --line:      #E3E1D9;   /* hairline */
  --line-2:    #D2CFC5;
  --accent:    #1F1D1A;   /* CTA = ink, monochrome */
  --on-accent: #F4F3EF;

  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans:  'Hanken Grotesk', system-ui, -apple-system, sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;

  --maxw: 1240px;
  --pad: clamp(20px, 5vw, 64px);
  --r: 4px;
}

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.5;
  letter-spacing: -0.005em;
}
::selection { background: #1f1d1a1f; }
a { color: inherit; text-decoration: none; }
img, video { display: block; max-width: 100%; }

/* ---- type primitives ---- */
.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.018em; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; margin: 0; }

/* ---- buttons ---- */
.btn {
  --bw: 1px;
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--sans); font-size: 15px; font-weight: 500;
  letter-spacing: 0;
  padding: 14px 22px;
  border-radius: 100px;
  border: var(--bw) solid transparent;
  cursor: pointer;
  transition: background .25s ease, color .25s ease, border-color .25s ease, transform .15s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--on-accent); }
.btn-primary:hover { background: #2e2b24; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn-ghost:hover { background: #1f1d1a0a; border-color: var(--ink); }
.btn .arrow { transition: transform .25s ease; }
.btn:hover .arrow { transform: translateX(3px); }

/* ---- layout helpers ---- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }
.hairline { height: 1px; background: var(--line); border: 0; margin: 0; }

/* reveal on scroll — visible by default (opacity 1) so content NEVER hides;
   JS only removes a subtle offset for a gentle entrance. */
.reveal { opacity: 1; transform: translateY(14px); transition: transform .7s cubic-bezier(.2,.7,.2,1); will-change: transform; }
.reveal.in { transform: none; }

/* striped placeholder texture (for video / avatar slots) */
.placeholder-stripes {
  background-color: var(--bg-tint);
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 11px, #1a191609 11px 12px);
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; transition: none; }
}

/* ============================================================
   PROSECUTO — meeting room (Lawyer & Judge shared layout)
   3D avatar stage (left) · transcript + chat + documents (right)
   ============================================================ */

.room {
  height: 100vh; height: 100dvh; width: 100%;
  display: grid; grid-template-columns: minmax(380px, 42%) 1fr;
  overflow: hidden;
}
@media (max-width: 900px){ .room { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; } }

/* ---------------- LEFT · AVATAR STAGE ---------------- */
.stage {
  position: relative; height: 100%;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  background: var(--bg-tint);
  overflow: hidden;
}
/* the actual 3D face goes here — placeholder fill */
.avatar-slot {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px;
}
.avatar-slot .ring {
  width: clamp(150px, 26vh, 230px); aspect-ratio: 1; border-radius: 50%;
  border: 1.5px solid var(--line-2);
  display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--bg) 60%, transparent), transparent 70%);
}
.avatar-slot .ring::before {
  content: ""; position: absolute; inset: -1.5px; border-radius: 50%;
  border: 1.5px solid var(--ink); clip-path: inset(0 0 50% 0);
  opacity: 0; transition: opacity .3s;
}
.stage.speaking .avatar-slot .ring::before { opacity: .9; animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.avatar-glyph { font-family: var(--serif); font-size: clamp(46px, 8vh, 80px); color: var(--ink); }
.avatar-slot code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .03em; text-align: center; }
.avatar-slot .who-name { font-family: var(--serif); font-size: 26px; }
.avatar-slot .who-role { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-2); margin-top: 4px; }

/* top-left chrome */
.stage-top {
  position: relative; z-index: 3;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px;
}
.back-link { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink); }
.back-link:hover { opacity: .65; }
.mode-pill {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  padding: 6px 11px; border-radius: 100px; border: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--bg) 60%, transparent);
}

/* live caption over the avatar */
.caption {
  position: relative; z-index: 3; margin-top: auto;
  padding: 22px; 
}
.caption-inner {
  background: color-mix(in srgb, var(--ink) 92%, transparent); color: var(--on-accent);
  border-radius: 12px; padding: 18px 20px; min-height: 58px;
  font-size: 18px; line-height: 1.45; letter-spacing: -.01em;
  box-shadow: 0 12px 40px -16px rgba(0,0,0,.4);
  opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s;
}
.caption-inner.show { opacity: 1; transform: none; }
.caption .spk { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #b9b1a0; display: block; margin-bottom: 8px; }
/* speaking waveform */
.wave { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; margin-left: 8px; vertical-align: middle; }
.wave i { width: 3px; height: 5px; background: #b9b1a0; border-radius: 2px; }
.stage.speaking .wave i { animation: bounce .9s ease-in-out infinite; }
.wave i:nth-child(2){ animation-delay: .15s } .wave i:nth-child(3){ animation-delay: .3s }
.wave i:nth-child(4){ animation-delay: .45s } .wave i:nth-child(5){ animation-delay: .1s }
@keyframes bounce { 0%,100%{ height: 4px } 50%{ height: 14px } }

/* ---------------- RIGHT · CONVERSATION ---------------- */
.panel { display: flex; flex-direction: column; height: 100%; min-width: 0; background: var(--bg); }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 24px; border-bottom: 1px solid var(--line);
}
.panel-head h1 { font-size: 21px; }
.panel-head .sub { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); }
.head-tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 100px; padding: 3px; }
.head-tabs button {
  font-family: var(--sans); font-size: 13px; color: var(--muted); border: 0; background: transparent;
  padding: 7px 15px; border-radius: 100px; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; gap: 7px;
}
.head-tabs button.active { background: var(--ink); color: var(--on-accent); }
.head-tabs .badge { font-family: var(--mono); font-size: 10px; background: var(--bg-tint); color: var(--ink); border-radius: 100px; padding: 1px 6px; }
.head-tabs button.active .badge { background: #ffffff22; color: var(--on-accent); }

/* transcript scroll area */
.transcript { flex: 1; overflow-y: auto; padding: 26px 24px 12px; scroll-behavior: smooth; }
.transcript::-webkit-scrollbar { width: 9px; }
.transcript::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 100px; border: 3px solid var(--bg); }

.turn { margin-bottom: 24px; max-width: 92%; animation: rise .45s cubic-bezier(.2,.7,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
.turn .meta { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.turn .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 13px; flex: none; }
.turn .nm { font-size: 13px; font-weight: 600; }
.turn .rl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); }
.turn .body {
  font-size: 16px; line-height: 1.55; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px;
  padding: 14px 17px;
}
.turn.me { margin-left: auto; }
.turn.me .meta { flex-direction: row-reverse; }
.turn.me .body { background: var(--ink); color: var(--on-accent); border: 0; border-radius: 14px 4px 14px 14px; }
.turn .av.alex { background: var(--ink); color: var(--on-accent); }
.turn .av.crown { background: #6f2c2c; color: #f4e7e7; }
.turn .av.judge { background: #25324a; color: #e7ecf4; }
.turn .av.clerk { background: var(--bg-tint); color: var(--ink); border: 1px solid var(--line-2); }
.turn .av.me { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }

/* shared-document card inside transcript */
.doc-card {
  margin-top: 10px; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface);
  cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s;
}
.doc-card:hover { border-color: var(--ink); transform: translateY(-1px); box-shadow: 0 10px 30px -18px rgba(0,0,0,.35); }
.doc-card .dc-top { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.doc-card .dc-ico { width: 34px; height: 42px; border: 1px solid var(--line-2); border-radius: 3px; background: var(--bg); position: relative; flex: none; }
.doc-card .dc-ico::before { content:""; position:absolute; inset: 7px 7px auto 7px; height: 2px; background: var(--line-2); box-shadow: 0 5px 0 var(--line-2), 0 10px 0 var(--line-2), 0 15px 0 var(--line-2); }
.doc-card .dc-t { font-family: var(--serif); font-size: 16px; }
.doc-card .dc-s { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); margin-top: 2px; }
.doc-card .dc-open { margin-left: auto; font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

/* thinking dots */
.thinking { display: inline-flex; gap: 5px; padding: 4px 2px; }
.thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); animation: blink 1.2s infinite both; }
.thinking i:nth-child(2){ animation-delay: .2s } .thinking i:nth-child(3){ animation-delay: .4s }
@keyframes blink { 0%,100%{ opacity: .25; transform: translateY(0) } 50%{ opacity: 1; transform: translateY(-3px) } }

/* ---------------- COMPOSER ---------------- */
.composer { border-top: 1px solid var(--line); padding: 16px 24px 20px; background: var(--bg); }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip {
  font-family: var(--sans); font-size: 13.5px; line-height: 1.4; color: var(--ink);
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 13px;
  padding: 9px 15px; cursor: pointer; transition: .18s; text-align: left; max-width: 100%;
}
.chip:hover { border-color: var(--ink); background: var(--surface-2); transform: translateY(-1px); }
.input-row { display: flex; align-items: flex-end; gap: 10px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; padding: 8px 8px 8px 16px; transition: border-color .2s; }
.input-row:focus-within { border-color: var(--ink); }
.input-row textarea {
  flex: 1; border: 0; background: transparent; resize: none; outline: none;
  font-family: var(--sans); font-size: 15.5px; color: var(--ink); line-height: 1.5;
  max-height: 120px; padding: 6px 0;
}
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; flex: none; cursor: pointer;
  display: grid; place-items: center; border: 1px solid var(--line-2); background: var(--bg);
  transition: .18s; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.mic.live { background: #6f2c2c; border-color: #6f2c2c; color: #fff; animation: micpulse 1.4s infinite; }
@keyframes micpulse { 0%,100%{ box-shadow: 0 0 0 0 #6f2c2c55 } 50%{ box-shadow: 0 0 0 8px #6f2c2c00 } }
.send-btn { background: var(--ink); color: var(--on-accent); border: 0; }
.send-btn:hover { background: #2e2b24; }
.send-btn:disabled { opacity: .4; cursor: default; }

/* ---------------- DOCUMENT VIEWER (right drawer) ---------------- */
.docview {
  position: absolute; inset: 0; z-index: 20; pointer-events: none;
  display: flex; justify-content: flex-end;
}
.docview .scrim { position: absolute; inset: 0; background: #1a191600; transition: background .3s; }
.docview .sheet {
  position: relative; width: min(560px, 92%); height: 100%; background: var(--surface);
  border-left: 1px solid var(--line-2); transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
  display: flex; flex-direction: column; box-shadow: -30px 0 80px -40px rgba(0,0,0,.4);
}
.docview.open { pointer-events: auto; }
.docview.open .scrim { background: #1a191633; }
.docview.open .sheet { transform: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.sheet-head .st { font-family: var(--serif); font-size: 19px; }
.sheet-head .ss { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-2); }
.sheet-body { flex: 1; overflow-y: auto; padding: 28px 30px; }
.legal-doc { font-family: var(--serif); color: var(--ink); }
.legal-doc .lh { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-2); border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; }
.legal-doc h2 { font-size: 26px; text-align: center; margin-bottom: 6px; }
.legal-doc .sec-no { text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: 24px; }
.legal-doc p { font-size: 16px; line-height: 1.7; margin: 0 0 16px; }
.legal-doc .fill { background: #efe7d3; border-bottom: 1px solid var(--muted-2); padding: 0 4px; font-style: italic; }
.legal-doc .cite { font-family: var(--mono); font-size: 13px; background: var(--bg-tint); border-radius: 6px; padding: 12px 14px; line-height: 1.6; }
.legal-doc .sig-row { display: flex; gap: 40px; margin-top: 40px; }
.legal-doc .sig { flex: 1; border-top: 1px solid var(--ink); padding-top: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- DOCUMENTS Alex can share ---------- */
const DOCS = {
  statdec: {
    title: "Statutory Declaration",
    sub: "Ground 1 · Owner was not the driver",
    render: () => (
      <div className="legal-doc">
        <div className="lh"><span>Form · Ontario</span><span>Prov. Offences Act</span></div>
        <h2>Statutory Declaration</h2>
        <div className="sec-no">Declaration of the Vehicle Owner</div>
        <p>I, <span className="fill">[owner full name]</span>, of the City of <span className="fill">[city]</span>, in the Province of Ontario, do solemnly declare that:</p>
        <p>1. I am the registered owner of the motor vehicle bearing Ontario licence plate <span className="fill">[plate]</span>.</p>
        <p>2. On <span className="fill">[offence date]</span>, at the intersection of <span className="fill">[intersection]</span>, I was <b>not</b> the driver of the said vehicle.</p>
        <p>3. The driver at the relevant time was <span className="fill">[driver name]</span>, who has knowledge of these facts.</p>
        <p>And I make this solemn declaration conscientiously believing it to be true, and knowing that it is of the same force and effect as if made under oath.</p>
        <div className="sig-row">
          <div className="sig">Declarant signature</div>
          <div className="sig">Commissioner for taking affidavits</div>
        </div>
      </div>
    )
  },
  caselaw: {
    title: "R. v. Jordan, 2016 SCC 27",
    sub: "Case law · s.11(b) Charter — delay",
    render: () => (
      <div className="legal-doc">
        <div className="lh"><span>Supreme Court of Canada</span><span>2016 SCC 27</span></div>
        <h2>R. v. Jordan</h2>
        <div className="sec-no">Right to be tried within a reasonable time</div>
        <p>The Supreme Court set a <b>presumptive ceiling</b> beyond which delay is considered unreasonable under s.11(b) of the Charter. For matters in provincial court, that ceiling is <b>18 months</b> from the charge to the actual or anticipated end of trial.</p>
        <p className="cite">“…a presumptive ceiling of 18 months for cases tried in the provincial court. Delay beyond this ceiling is presumptively unreasonable.”</p>
        <p style={{marginTop:'18px'}}><b>Why it matters for you:</b> if your trial date falls more than 18 months after the date on your Certificate of Offence, this is a live ground to have the charge stayed. We will calculate this precisely once we confirm both dates.</p>
        <p style={{color:'var(--muted)', fontSize:'14px'}}>Verify the current state of the law with a paralegal — ceilings and deductions have nuance.</p>
      </div>
    )
  },
  package: {
    title: "Your Preparation Package",
    sub: "Generated for your case",
    render: () => (
      <div className="legal-doc">
        <div className="lh"><span>Prosecuto · Lawyer Mode</span><span>Draft v1</span></div>
        <h2>Preparation Package</h2>
        <div className="sec-no">Dispute path · Both — Early Resolution, then Trial</div>
        <p style={{fontFamily:'var(--mono)',fontSize:'12px',letterSpacing:'.1em',textTransform:'uppercase',color:'var(--muted-2)'}}>[ Opening statement ]</p>
        <p>“Good morning, Your Worship. My name is <span className="fill">[name]</span>. I am the registered owner of the vehicle, but I was not its driver on the date in question, and I'll be relying on a statutory declaration to that effect.”</p>
        <p style={{fontFamily:'var(--mono)',fontSize:'12px',letterSpacing:'.1em',textTransform:'uppercase',color:'var(--muted-2)',marginTop:'24px'}}>[ Defence script — order of play ]</p>
        <p>1. Confirm your identity and ownership.<br/>2. Tender the statutory declaration naming the driver.<br/>3. Request the camera operating &amp; calibration certificate in disclosure.<br/>4. If the trial date is &gt; 18 months out, raise s.11(b).</p>
        <p style={{fontFamily:'var(--mono)',fontSize:'12px',letterSpacing:'.1em',textTransform:'uppercase',color:'var(--muted-2)',marginTop:'24px'}}>[ Bring to court ]</p>
        <p>— Signed statutory declaration<br/>— A copy of the Certificate of Offence<br/>— Any disclosure the Crown provided</p>
        <p style={{fontFamily:'var(--mono)',fontSize:'12px',letterSpacing:'.1em',textTransform:'uppercase',color:'var(--muted-2)',marginTop:'24px'}}>[ Delivery ]</p>
        <p>Address the bench as “Your Worship.” Speak slowly. Don't argue facts that aren't in dispute. Concede nothing about who was driving beyond the declaration.</p>
      </div>
    )
  }
};

/* ---------- Scripted intake flow for Alex ---------- */
const FLOW = [
  {
    text: "I'm Alex. I'll help you build a real defence for your red light camera ticket — plain language, your case only. To start: when were you issued the ticket, and which intersection was it?",
    suggest: ["March 3, 2026 — Hurontario & Eglinton", "About two weeks ago", "I don't have the date in front of me"]
  },
  {
    text: "Good. Now the question that decides everything: when the camera fired, were you driving — or is the car yours but someone else was behind the wheel?",
    suggest: ["It's my car, but my partner was driving", "I was the driver", "I'd already sold the car"]
  },
  {
    text: "That's your strongest ground — owner was not the driver. A red light camera ticket is owner liability, so if we put the actual driver on the record with a sworn declaration, the charge against you becomes very hard to sustain. Here's the form we'll prepare.",
    doc: "statdec",
    suggest: ["My partner will sign it", "Will they get the ticket instead?", "What if they won't sign?"]
  },
  {
    text: "Next we make the Crown prove its case. I'll have you formally request full disclosure — the camera's operating and calibration records. You're entitled to it before trial, and gaps in it are a defence on their own. One more lever depends on timing.",
    doc: "caselaw",
    suggest: ["My trial is 20 months out", "It's only a few months away", "How do I request disclosure?"]
  },
  {
    text: "Then s.11(b) is live and I've flagged it. I've assembled everything into your preparation package — opening statement, the order you'll speak in, what to bring, and how to carry yourself. Read it, then I'd rehearse the whole thing in a mock trial before the real date.",
    doc: "package",
    suggest: ["Open the package", "Run a mock trial", "Can you quiz me first?"]
  },
  {
    text: "Whenever you're ready, step into Judge Mode and we'll run the full hearing — Crown, clerk, and a Justice of the Peace — start to finish, then I'll review how you did. You can come back to me anytime to adjust the package.",
    suggest: ["Run mock trial", "Stay and prepare more"]
  }
];

const ROLE_META = {
  alex: { nm: "Alex", rl: "Lawyer", av: "alex", glyph: "A" },
  me:   { nm: "You",  rl: "Defendant", av: "me", glyph: "Y" }
};

function App() {
  const [messages, setMessages] = useState([]);
  const [step, setStep] = useState(-1);
  const [suggest, setSuggest] = useState([]);
  const [input, setInput] = useState("");
  const [speaking, setSpeaking] = useState(false);
  const [caption, setCaption] = useState({ text: "", show: false });
  const [thinking, setThinking] = useState(false);
  const [tab, setTab] = useState("chat");
  const [openDoc, setOpenDoc] = useState(null);
  const [mic, setMic] = useState(false);
  const transcriptRef = useRef(null);
  const captionTimer = useRef(null);

  const sharedDocs = messages.filter(m => m.doc).map(m => m.doc);

  const scrollDown = useCallback(() => {
    requestAnimationFrame(() => {
      const el = transcriptRef.current;
      if (el) el.scrollTop = el.scrollHeight;
    });
  }, []);

  // typewriter caption
  const speak = useCallback((text) => {
    clearInterval(captionTimer.current);
    setSpeaking(true);
    setCaption({ text: "", show: true });
    const words = text.split(" ");
    let i = 0;
    captionTimer.current = setInterval(() => {
      i++;
      setCaption({ text: words.slice(0, i).join(" "), show: true });
      if (i >= words.length) {
        clearInterval(captionTimer.current);
        setTimeout(() => setSpeaking(false), 400);
      }
    }, 55);
  }, []);

  const runAlex = useCallback((idx) => {
    const node = FLOW[idx];
    if (!node) return;
    setSuggest([]);
    setThinking(true);
    scrollDown();
    setTimeout(() => {
      setThinking(false);
      setMessages(m => [...m, { role: "alex", text: node.text, doc: node.doc || null }]);
      speak(node.text);
      setSuggest(node.suggest || []);
      setStep(idx);
      scrollDown();
    }, 900);
  }, [speak, scrollDown]);

  // kick off
  useEffect(() => { const t = setTimeout(() => runAlex(0), 600); return () => clearTimeout(t); }, [runAlex]);
  useEffect(scrollDown, [messages, thinking]);

  const send = (text) => {
    const val = (text ?? input).trim();
    if (!val || thinking) return;
    clearInterval(captionTimer.current); setSpeaking(false);
    setMessages(m => [...m, { role: "me", text: val }]);
    setInput("");
    setSuggest([]);
    setMic(false);
    const next = step + 1;
    setTimeout(() => runAlex(next), 500);
  };

  const onChip = (c) => {
    if (c === "Run mock trial") { window.location.href = "Judge - Mock Trial.html"; return; }
    if (c === "Open the package") { setOpenDoc("package"); return; }
    send(c);
  };

  return (
    <div className="room">
      {/* LEFT — 3D avatar stage */}
      <div className={"stage" + (speaking ? " speaking" : "")}>
        <div className="stage-top">
          <a className="back-link" href="Prosecuto - Landing.html">← Prosecuto</a>
          <span className="mode-pill">Lawyer Mode</span>
        </div>

        <div className="avatar-slot">
          <div className="ring"><span className="avatar-glyph">A</span></div>
          <div style={{textAlign:'center'}}>
            <div className="who-name serif">Alex</div>
            <div className="who-role">Lawyer · Case prep</div>
          </div>
          <code>{/* your 3D face mounts in this stage */}3D avatar mounts here — left stage</code>
        </div>

        <div className="caption">
          <div className={"caption-inner" + (caption.show ? " show" : "")}>
            <span className="spk">Alex
              <span className="wave"><i></i><i></i><i></i><i></i><i></i></span>
            </span>
            {caption.text || "…"}
          </div>
        </div>
      </div>

      {/* RIGHT — conversation */}
      <div className="panel">
        <div className="panel-head">
          <div>
            <h1 className="serif">Case preparation</h1>
            <div className="sub">Early Resolution &amp; Trial</div>
          </div>
          <div className="head-tabs">
            <button className={tab==="chat"?"active":""} onClick={()=>setTab("chat")}>Conversation</button>
            <button className={tab==="docs"?"active":""} onClick={()=>setTab("docs")}>
              Documents <span className="badge">{sharedDocs.length}</span>
            </button>
          </div>
        </div>

        {tab === "chat" ? (
          <div className="transcript" ref={transcriptRef}>
            {messages.map((m, i) => {
              const meta = ROLE_META[m.role];
              return (
                <div key={i} className={"turn" + (m.role==="me" ? " me" : "")}>
                  <div className="meta">
                    <span className={"av " + meta.av}>{meta.glyph}</span>
                    <span className="nm">{meta.nm}</span>
                    <span className="rl">{meta.rl}</span>
                  </div>
                  <div className="body">{m.text}</div>
                  {m.doc && (
                    <div className="doc-card" onClick={()=>setOpenDoc(m.doc)}>
                      <div className="dc-top">
                        <div className="dc-ico"></div>
                        <div>
                          <div className="dc-t">{DOCS[m.doc].title}</div>
                          <div className="dc-s">{DOCS[m.doc].sub}</div>
                        </div>
                        <div className="dc-open">Open →</div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
            {thinking && (
              <div className="turn">
                <div className="meta"><span className="av alex">A</span><span className="nm">Alex</span><span className="rl">Lawyer</span></div>
                <div className="body"><span className="thinking"><i></i><i></i><i></i></span></div>
              </div>
            )}
          </div>
        ) : (
          <div className="transcript" ref={transcriptRef}>
            {sharedDocs.length === 0 && (
              <p style={{color:'var(--muted)',fontFamily:'var(--mono)',fontSize:'13px'}}>No documents shared yet. Alex will share forms and case law as your case develops.</p>
            )}
            {sharedDocs.map((d, i) => (
              <div className="doc-card" key={i} style={{marginBottom:'14px'}} onClick={()=>setOpenDoc(d)}>
                <div className="dc-top">
                  <div className="dc-ico"></div>
                  <div>
                    <div className="dc-t">{DOCS[d].title}</div>
                    <div className="dc-s">{DOCS[d].sub}</div>
                  </div>
                  <div className="dc-open">Open →</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* composer */}
        <div className="composer">
          {suggest.length > 0 && (
            <div className="suggest">
              {suggest.map((s, i) => <button key={i} className="chip" onClick={()=>onChip(s)}>{s}</button>)}
            </div>
          )}
          <div className="input-row">
            <textarea
              rows="1" placeholder="Type your answer, or use the mic…"
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } }}
            />
            <button className={"icon-btn mic" + (mic ? " live" : "")} title="Voice input" onClick={()=>setMic(v=>!v)}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
            </button>
            <button className="icon-btn send-btn" disabled={!input.trim()} onClick={()=>send()} title="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>

        {/* document viewer drawer */}
        <div className={"docview" + (openDoc ? " open" : "")}>
          <div className="scrim" onClick={()=>setOpenDoc(null)}></div>
          <div className="sheet">
            {openDoc && (
              <React.Fragment>
                <div className="sheet-head">
                  <div>
                    <div className="st">{DOCS[openDoc].title}</div>
                    <div className="ss">{DOCS[openDoc].sub}</div>
                  </div>
                  <button className="icon-btn" onClick={()=>setOpenDoc(null)} title="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
                  </button>
                </div>
                <div className="sheet-body">{DOCS[openDoc].render()}</div>
              </React.Fragment>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
