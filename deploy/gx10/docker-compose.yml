# Prosecuto GX10 — vLLM only.
# API and Redis run natively via systemd (prosecuto-api.service + redis-server).
# Start: docker compose -f deploy/gx10/docker-compose.yml up -d

name: prosecuto-gx10

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: prosecuto-vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "8001:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command: >
      nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4
      --dtype auto
      --max-model-len 32768
      --gpu-memory-utilization 0.70
      --enable-chunked-prefill
      --max-num-seqs 32
      --trust-remote-code
      --api-key password
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  huggingface-cache:
