# Prosecuto GX10 — vLLM only.
# API and Redis run natively via systemd (prosecuto-api.service + redis-server).
# Start: docker compose -f deploy/gx10/docker-compose.yml up -d
#
# Image: NVIDIA's official GB10/Blackwell-optimized vLLM (nvcr.io/nvidia/vllm:26.03.post1-py3).
# Built with native SM12.0/SM12.1 kernels — replaces the generic vllm/vllm-openai image
# which fell back to slow PTX JIT compilation on the GB10.
#
# One-time auth required before pulling:
#   docker login nvcr.io   (use NGC API key from https://ngc.nvidia.com/setup/api-key)

name: prosecuto-gx10

services:
  vllm:
    image: nvcr.io/nvidia/vllm:25.09-py3
    container_name: prosecuto-vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "8001:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command: >
      vllm serve nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4
      --dtype auto
      --max-model-len 32768
      --gpu-memory-utilization 0.70
      --enable-chunked-prefill
      --max-num-seqs 32
      --trust-remote-code
      --api-key password
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  huggingface-cache:
