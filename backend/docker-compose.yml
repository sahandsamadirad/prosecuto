# Prosecuto backend dev stack: FastAPI + Redis.
# On GX10: set LLM_PROVIDER=local, LOCAL_LLM_ENDPOINT=http://vllm:8001/v1 and
# LOCAL_LLM_MODEL=nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4 in .env, then
# uncomment the vllm service below.
# On laptop: LLM_PROVIDER=auto with NVIDIA_API_KEY routes to NIM cloud.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Point at the in-compose services regardless of .env localhost values.
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      CORPUS_DIR: /app/data/corpus
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  # vLLM — uncomment on GX10 (requires NVIDIA GB10, CUDA 13, and HF_TOKEN in .env).
  # Serves nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4 via OpenAI-compatible API.
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: prosecuto-vllm
  #   restart: unless-stopped
  #   runtime: nvidia
  #   ipc: host
  #   ports:
  #     - "8001:8000"
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #     HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
  #   volumes:
  #     - huggingface-cache:/root/.cache/huggingface
  #   command: >
  #     --model nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4
  #     --served-model-name nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-NVFP4
  #     --dtype auto
  #     --max-model-len 32768
  #     --gpu-memory-utilization 0.85
  #     --enable-chunked-prefill
  #     --max-num-seqs 32
  #     --port 8000

volumes:
  redis-data:
  # huggingface-cache:  # uncomment alongside the vllm service
